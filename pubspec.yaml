name: structure_radar
description: USDT market structure scanner — educational Free #2.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.4.0
  intl: ^0.20.2
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#07080B"
  adaptive_icon_foreground: assets/branding/app_icon_fg.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#07080B"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#07080B"
    image: assets/branding/splash_logo.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
